# nginx for Gudiya Stories. Installed by setup-server.sh (replaces __DOMAIN__).
# Cloudflare is in front (proxied). Only Cloudflare can reach ports 80/443 (AWS
# security group), and $remote_addr is the visitor's real IP thanks to
# conf.d/cloudflare-realip.conf.

limit_req_zone $binary_remote_addr zone=gudiya_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gudiya_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gudiya_pages:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gudiya_conn:10m;
limit_req_status 429;

upstream gudiya_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    server_tokens off;
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    # "listen … http2" is the syntax Ubuntu 24.04's nginx 1.24 understands.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Cloudflare Origin Certificate (or a self-signed one until it's added).
    ssl_certificate     /etc/ssl/gudiya/origin.pem;
    ssl_certificate_key /etc/ssl/gudiya/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 210m;          # admin video uploads (200 MB)
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn gudiya_conn 40;

    # One address for search engines: www → bare domain.
    if ($host = www.__DOMAIN__) {
        return 301 https://__DOMAIN__$request_uri;
    }

    # Block probes for files that never exist here.
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak)$ { return 404; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Overwrite (not append): visitors can't fake their IP to dodge rate limits.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    # Files uploaded in Admin: straight from disk (fast, supports video seeking).
    location /uploads/ {
        alias /srv/gudiya/shared/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://gudiya_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /admin/login {
        limit_req zone=gudiya_login burst=10 nodelay;
        proxy_pass http://gudiya_app;
    }
    location /api/auth/ {
        limit_req zone=gudiya_login burst=10 nodelay;
        proxy_pass http://gudiya_app;
    }

    location /api/admin/upload {
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://gudiya_app;
    }

    location /api/ {
        limit_req zone=gudiya_api burst=40 nodelay;
        proxy_pass http://gudiya_app;
    }

    location / {
        limit_req zone=gudiya_pages burst=60 nodelay;
        proxy_pass http://gudiya_app;
    }
}
